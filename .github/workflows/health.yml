name: Мониторинг

# Каждые 10 минут проверяем /api/health; если сайт не отвечает — сообщение в Telegram.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  health:
    if: vars.DOMAIN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Проверить сайт и базу
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: https://${{ vars.DOMAIN }}/api/health
        run: |
          if curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 15 "$URL"; then
            exit 0
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -fsS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode text="Агроинвест: сайт не отвечает ($URL). Проверьте сервер." >/dev/null
          fi
          exit 1
